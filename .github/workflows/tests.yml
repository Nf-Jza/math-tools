name: Tests

on:
  push:
    branches: [main, fix/computation-safety-and-accuracy]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Install locked dependencies
        run: uv sync --frozen --python "${{ matrix.python }}"
      - name: Run regression suite
        run: uv run --frozen --python "${{ matrix.python }}" pytest -q --tb=short

[project]
name = "math-tools"
version = "0.1.0"
description = "Deterministic math and symbolic calculation engine MCP for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.11.0",
    "lark>=1.3.1",
    "mcp[cli]>=2.3.0",
    "sympy>=1.14.0",
]

[project.scripts]
math-tools = "math_tools.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
